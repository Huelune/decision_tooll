[project]
name = "decision-tool"
version = "0.1.0"
description = "Offline C decision-coverage estimation and boundary-case helper"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
decision-tool = "decision_tool.cli:main"
decision-tool-gui = "decision_tool.gui:main"

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.build-backend]
source-include = ["tests/**", "examples/**"]
